app-id: ac.d3v.ZaloLinux
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: zalo
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # Zalo dung hop thoai file cua Electron (chua di qua portal), nen can quyen
  # doc/ghi thu muc nha de dinh kem va luu file. Nguoi duyet Flathub thuong hoi
  # ve dong nay — cau tra loi: bo no thi khong gui/luu file duoc.
  - --filesystem=home
  - --filesystem=xdg-download
  # O gan ngoai (USB/NTFS/o phu). Thieu cai nay thi file tren cac o do bi
  # sandbox chan: Zalo bao "file khong hop le, sai dinh dang" va kich thuoc = 0,
  # vi trinh duyet thay ten file nhung doc noi dung ra rong.
  # Fedora/udisks2 gan o /run/media/<user>, cac ban khac o /media.
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Electron dang ky tray qua SNI voi ten bus org.kde.StatusNotifierItem-<pid>-<n>.
  # Trong sandbox zypak, browser process luon la PID 2 -> ten la -2-1/-2-2.
  # Thieu own-name nay: "Failed to get the ownership of StatusNotifierItem" -> tray hong.
  - --own-name=org.kde.StatusNotifierItem-2-1
  - --own-name=org.kde.StatusNotifierItem-2-2
  - --talk-name=com.canonical.AppMenu.Registrar
  - --env=TMPDIR=/var/tmp
  # Di tru du lieu tu app-id cu (io.github.zalolinux.Zalo). Bo dong nay sau vai ban.
  - --filesystem=~/.var/app/io.github.zalolinux.Zalo:ro

modules:
  # Zypak: cho phep sandbox cua Chromium chay ben trong Flatpak, thay vi phai
  # dung --no-sandbox. Flathub bat buoc voi moi app Electron.
  - name: zypak
    # Zypak dung Makefile (khong phai meson) va cai thang vao $FLATPAK_DEST.
    buildsystem: simple
    build-commands:
      - make -j$(nproc)
      - make install
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09

  - name: zalo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/zalo /app/electron /app/bin
      - cp -r stage/app/. /app/zalo/
      - cp -r stage/electron/. /app/electron/
      - chmod +x /app/electron/electron /app/electron/chrome-sandbox || true
      - install -Dm755 jxlbin/djxl /app/bin/djxl
      - install -Dm755 jxlbin/cjxl /app/bin/cjxl
      # Chep TAT CA thu vien djxl/cjxl can (fetch-sources.sh da do bang ldd).
      # Danh sach cung truoc day thieu libjxl*.so -> djxl chet luc chay.
      - for f in jxlbin/*.so*; do install -Dm755 "$f" "/app/lib/$(basename "$f")"; done
      - install -Dm755 zalo-launch.sh /app/bin/zalo
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/ac.d3v.ZaloLinux.png
      - install -Dm644 ac.d3v.ZaloLinux.desktop /app/share/applications/ac.d3v.ZaloLinux.desktop
      - install -Dm644 ac.d3v.ZaloLinux.metainfo.xml /app/share/metainfo/ac.d3v.ZaloLinux.metainfo.xml
    sources:
      - type: dir
        path: .
