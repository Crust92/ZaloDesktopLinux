app-id: io.github.zalolinux.Zalo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: zalo
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --env=TMPDIR=/var/tmp

modules:
  - name: zalo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/zalo /app/electron /app/bin
      - cp -r stage/app/. /app/zalo/
      - cp -r stage/electron/. /app/electron/
      - chmod +x /app/electron/electron /app/electron/chrome-sandbox || true
      - install -Dm755 jxlbin/djxl /app/bin/djxl
      - install -Dm755 jxlbin/cjxl /app/bin/cjxl
      - install -Dm755 jxlbin/libjpeg.so.8 /app/lib/libjpeg.so.8
      - install -Dm755 jxlbin/libgif.so.7 /app/lib/libgif.so.7
      - install -Dm755 zalo-launch.sh /app/bin/zalo
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.zalolinux.Zalo.png
      - install -Dm644 io.github.zalolinux.Zalo.desktop /app/share/applications/io.github.zalolinux.Zalo.desktop
    sources:
      - type: dir
        path: .
